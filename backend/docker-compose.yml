# Local development database for the EquipTrack API.
#   docker compose -f backend/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: equiptrack
      POSTGRES_USER: equiptrack
      POSTGRES_PASSWORD: equiptrack
    ports:
      - "5432:5432"
    volumes:
      - equiptrack-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equiptrack -d equiptrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  equiptrack-pg:
