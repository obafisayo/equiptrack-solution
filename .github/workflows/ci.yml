name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
          # Placeholders so the auth module can load at build time (no real secrets in CI).
          NEON_AUTH_BASE_URL: https://auth.ci.invalid/equiptrack/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-secret-not-used-at-runtime
